# YOLOv8 Dataset Configuration for India-Focused Traffic Sign Recognition
# Can be run locally or mounted on Google Colab

# Root path:
# When running locally from repository root:
path: ../dataset
# When running in Google Colab (uncomment below if mounted):
# path: /content/dataset

train: train/images
val: valid/images
test: test/images

# Number of classes
nc: 15

# Class names mapping (0-indexed)
names:
  0: Stop
  1: No Entry
  2: Speed Limit 20
  3: Speed Limit 40
  4: Speed Limit 60
  5: Speed Limit 80
  6: Give Way
  7: School Ahead
  8: Pedestrian Crossing
  9: Left Turn
  10: Right Turn
  11: U-Turn
  12: Horn Prohibited
  13: Parking
  14: Dangerous Curve
